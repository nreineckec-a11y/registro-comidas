<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://api.anthropic.com; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#F1F5EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101411" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Comidas">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Registro de comidas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&display=swap" rel="stylesheet">
<style>
/* Layout: una columna de teléfono. Resumen del día arriba, luego la comida que toca (abierta), las demás plegadas, y al final salidas y libres. */
:root{
  --bg:#F1F5EF;
  --surface:#FFFFFF;
  --ink:#1B2420;
  --muted:#5D6A63;
  --line:#DCE3DA;
  --accent:#3E7A2C;
  --accent-soft:#E3EFD9;
  --on-accent:#FFFFFF;
  --treat:#B0601A;
  --treat-soft:#F7E8D7;
  --on-treat:#FFFFFF;
  --font-display:'Bricolage Grotesque', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-body:'Atkinson Hyperlegible', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101411;
    --surface:#1A201C;
    --ink:#E4EAE5;
    --muted:#9BA8A0;
    --line:#2C352F;
    --accent:#9CCB6A;
    --accent-soft:#233220;
    --on-accent:#13200C;
    --treat:#E8A866;
    --treat-soft:#3A2919;
    --on-treat:#2A1706;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101411;
  --surface:#1A201C;
  --ink:#E4EAE5;
  --muted:#9BA8A0;
  --line:#2C352F;
  --accent:#9CCB6A;
  --accent-soft:#233220;
  --on-accent:#13200C;
  --treat:#E8A866;
  --treat-soft:#3A2919;
  --on-treat:#2A1706;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--font-body)}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:540px;margin:0 auto;padding:max(14px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) calc(96px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:1.5rem;line-height:1.15}
h2{font-size:1.15rem}
.muted{color:var(--muted)}
.small{font-size:.86rem}

/* Encabezado */
.hello{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;padding:4px 2px 0}
.hello p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.todaybtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.85rem;font-weight:700;cursor:pointer;white-space:nowrap}
.daynav{display:grid;grid-template-columns:36px 1fr 36px;align-items:center;gap:6px}
.navbtn{height:36px;width:36px;border-radius:50%;border:0;background:var(--bg);font-size:1.25rem;line-height:1;cursor:pointer}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.wd{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:12px;border:0;background:none;cursor:pointer}
.wd .ab{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.wd .num{font-size:.92rem;font-weight:700;font-variant-numeric:tabular-nums;width:30px;height:30px;display:grid;place-items:center;border-radius:50%}
.wd.sel .num{background:var(--accent);color:var(--on-accent)}
.wd.today:not(.sel) .num{box-shadow:inset 0 0 0 2px var(--accent)}
.wd.future{opacity:.5}
.pips{display:flex;gap:2px;height:6px;align-items:center}
.pip{width:4px;height:4px;border-radius:50%;background:var(--line)}
.pip.on{background:var(--accent)}
.pip.t{background:var(--treat)}

/* Resumen */
.hero{display:grid;grid-template-columns:128px 1fr;gap:16px;align-items:center}
.ring{position:relative;width:128px;height:128px}
.ring svg{width:128px;height:128px;display:block}
.ring .bgc{stroke:var(--line)}
.ring .fgc{stroke:var(--accent);transition:stroke-dasharray .35s ease}
.ring.over .fgc{stroke:var(--treat)}
.ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring-n{font-family:var(--font-display);font-size:1.9rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.ring.over .ring-n{color:var(--treat)}
.ring-l{font-size:.74rem;color:var(--muted);line-height:1.2;margin-top:3px}
.stats{display:flex;flex-direction:column;gap:10px;min-width:0}
.stat-top{display:flex;justify-content:space-between;gap:6px;font-size:.82rem;font-variant-numeric:tabular-nums}
.stat-top b{white-space:nowrap}
.stat-top span:first-child{color:var(--muted)}
.mini{height:8px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:4px}
.mini i{display:block;height:100%;border-radius:5px;background:var(--accent);transition:width .35s ease}
.mini.p i{background:var(--ink);opacity:.75}
.msg{margin:14px 0 0;padding:10px 12px;border-radius:12px;background:var(--accent-soft);font-size:.93rem}
.msg.warn{background:var(--treat-soft)}
.notes{display:flex;flex-direction:column;gap:8px}
.note{margin:0;padding:10px 12px;border-radius:12px;background:var(--treat-soft);font-size:.9rem;display:flex;gap:10px;align-items:flex-start}
.note.info{background:var(--accent-soft)}

/* Comidas */
.meals{display:flex;flex-direction:column;gap:10px}
.meal{padding:0;overflow:hidden}
.meal.open{border-color:var(--accent);box-shadow:0 1px 0 var(--accent)}
.mhead{width:100%;display:flex;align-items:center;gap:12px;padding:14px 16px;background:none;border:0;text-align:left;cursor:pointer}
.micon{width:42px;height:42px;border-radius:12px;background:var(--bg);display:grid;place-items:center;color:var(--accent);flex:none}
.meal.done .micon{background:var(--accent);color:var(--on-accent)}
.mtext{flex:1;min-width:0;display:flex;flex-direction:column}
.mname{font-family:var(--font-display);font-size:1.1rem;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.now{font-family:var(--font-body);font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:999px}
.msub{font-size:.84rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mprog{font-size:.85rem;font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted);flex:none}
.meal.done .mprog{color:var(--accent)}
.chev{color:var(--muted);transition:transform .2s ease;flex:none}
.meal.open .chev,.sethead[aria-expanded="true"] .chev{transform:rotate(90deg)}
.mbody{border-top:1px solid var(--line)}
.tip{margin:0;padding:10px 16px;font-size:.86rem;color:var(--muted);background:var(--bg)}

.slot{padding:4px 16px 4px 12px;border-top:1px solid var(--line)}
.slot:first-child{border-top:0}
.srow{display:flex;align-items:center;gap:6px}
.smain{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:10px 4px;background:none;border:0;text-align:left;cursor:pointer;border-radius:12px}
.box{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent;flex:none;transition:background .15s ease,border-color .15s ease}
.box svg{width:16px;height:16px}
.slot.on .box{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.stext{display:flex;flex-direction:column;min-width:0}
.sname{font-weight:700;line-height:1.3}
.slot.on .sname{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1.5px;text-decoration-color:var(--accent)}
.ssub{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.swap{border:0;background:var(--bg);border-radius:999px;padding:7px 12px;font-size:.82rem;font-weight:700;color:var(--accent);cursor:pointer;flex:none;min-height:36px}
.swap[aria-expanded="true"]{background:var(--accent-soft)}
.alts{display:flex;flex-direction:column;gap:6px;padding:0 0 12px 46px}
.alts-l{font-size:.78rem;color:var(--muted);margin:0}
.alt{display:flex;justify-content:space-between;gap:10px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;text-align:left;cursor:pointer;font-size:.9rem}
.alt.sel{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.alt small{color:var(--muted);font-weight:400;white-space:nowrap;font-variant-numeric:tabular-nums}

.snacks{display:grid;gap:8px;padding:14px 16px}
.snack{display:flex;gap:12px;align-items:center;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;text-align:left;cursor:pointer}
.snack .box{width:26px;height:26px}
.snack.sel{border-color:var(--accent);background:var(--accent-soft)}
.snack.sel .box{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.snack-t{flex:1;min-width:0;font-size:.92rem;line-height:1.3}
.snack-k{font-size:.78rem;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right}

.mfoot{display:flex;gap:8px;padding:10px 16px 14px;border-top:1px solid var(--line)}
.btn{flex:1;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:.9rem;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

/* Salidas */
.sal-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.sal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.sal{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:12px 6px;border-radius:14px;background:var(--bg)}
.sal-name{font-weight:700;font-size:.9rem;line-height:1.2}
.sal-hint{font-size:.74rem;color:var(--muted);line-height:1.25}
.toks{display:flex;gap:8px;justify-content:center}
.tok{width:52px;height:64px;border-radius:14px;border:1.5px dashed var(--treat);background:var(--surface);color:var(--treat);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;padding:0}
.tok span{font-size:.68rem;font-weight:700;line-height:1}
.tok.used{border-style:solid;background:var(--treat);color:var(--on-treat)}
.helpbtn{margin-top:12px;background:none;border:0;padding:4px 0;color:var(--accent);font-weight:700;font-size:.86rem;cursor:pointer}
.help{margin:6px 0 0;padding-left:18px;font-size:.86rem;color:var(--muted);display:grid;gap:4px}

.libres .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 12px;font-size:.88rem;cursor:pointer}
.chip.sel{background:var(--accent-soft);border-color:var(--accent);font-weight:700}

.foot{display:flex;flex-direction:column;gap:6px;font-size:.82rem;color:var(--muted);padding:0 4px}
.status{display:inline-flex;gap:8px;align-items:center}
.sdot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.status.ok .sdot{background:var(--accent)}
.status.warn .sdot{background:var(--treat)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;pointer-events:none;width:min(92vw,480px);background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:.92rem;box-shadow:0 8px 24px rgba(0,0,0,.18);transition:opacity .2s ease,transform .2s ease;z-index:10}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{background:none;border:0;color:var(--bg);font-weight:700;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:6px 2px;white-space:nowrap}


/* Agregar y personalizar */
.extras{padding:4px 16px 0}
.xhead{margin:10px 0 2px;font-size:.78rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.xrow{display:flex;align-items:center;gap:12px;padding:8px 0}
.xrow + .xrow{border-top:1px solid var(--line)}
.xrow .box{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.xtext{flex:1;min-width:0;display:flex;flex-direction:column}
.xname{font-weight:700;line-height:1.3}
.xsub{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.xdel{border:0;background:var(--bg);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:1.1rem;line-height:1;color:var(--muted);flex:none}
.addzone{padding:10px 16px 4px;display:grid;gap:8px}
.addbtn{width:100%;min-height:46px;border:1.5px dashed var(--line);border-radius:12px;background:none;color:var(--accent);font-weight:700;font-size:.92rem;cursor:pointer}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:700;padding:6px 0;cursor:pointer;font-size:.86rem;text-align:left}
.form{display:grid;gap:12px;padding:14px;border-radius:14px;background:var(--bg);border:1px solid var(--line)}
.form h3{font-size:1rem}
.field label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:4px}
.form input[type=text],.form input[type=number],.set-input{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);padding:8px 12px;font:inherit;font-size:16px}
.form input:focus,.set-input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.presets,.quick{display:flex;gap:6px;flex-wrap:wrap}
.preset{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 10px;font-size:.8rem;cursor:pointer}
.preset.sel{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.checkline{display:flex;gap:10px;align-items:center;font-size:.9rem;cursor:pointer}
.checkline input{width:20px;height:20px;accent-color:var(--accent)}
.formbtns{display:flex;gap:8px}
.err{margin:0;color:var(--treat);font-size:.85rem;font-weight:700}
.alt-wrap{display:flex;gap:6px;align-items:stretch}
.alt-wrap .alt{flex:1}
.addalt{border:1.5px dashed var(--line);background:none;border-radius:12px;padding:10px 12px;text-align:left;cursor:pointer;font-size:.88rem;font-weight:700;color:var(--accent)}
.tag{font-size:.68rem;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:1px 6px;margin-left:6px;vertical-align:middle}
.replaced{margin:0;padding:10px 16px;font-size:.88rem;background:var(--treat-soft)}


/* Escribir lo que comí */
.aibox{padding:14px 16px;display:grid;gap:10px;background:var(--accent-soft);border-bottom:1px solid var(--line)}
.ailabel{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.95rem;color:var(--ink)}
.ailabel svg{color:var(--accent)}
.aibox textarea{width:100%;min-height:64px;resize:vertical;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;font-size:16px;line-height:1.35;background:var(--surface);color:var(--ink)}
.aibox textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.aibox .btn{width:100%}
.airow{display:flex;align-items:center;gap:10px}
.dots{display:inline-flex;gap:4px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:blink 1.2s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.2s}
.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.aires{border:1px solid var(--accent);background:var(--surface);border-radius:14px;padding:12px;display:grid;gap:8px}
.aires-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.aitem{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:.9rem}
.aitem.tot{border-top:2px solid var(--ink)}
.aname{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.aname small,.aval small{color:var(--muted);font-size:.76rem;font-variant-numeric:tabular-nums}
.aval{display:flex;flex-direction:column;align-items:flex-end;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.preset.hist{display:inline-flex;gap:6px;align-items:baseline;text-align:left;max-width:100%}
.preset.hist span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:15em}
.preset.hist small{color:var(--muted);white-space:nowrap}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.row3 label{font-size:.74rem}
.xdet{display:block;color:var(--muted);font-size:.74rem;line-height:1.3;margin-top:2px}
.mini.c i{background:var(--accent)}
.mini.g i{background:var(--treat)}


/* Pestañas */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.tabs button{min-height:40px;border:0;border-radius:10px;background:none;font-weight:700;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--on-accent)}
.view{display:flex;flex-direction:column;gap:14px}
.view[hidden]{display:none}

/* Registro diario */
.logrow{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
.logrow label,.logrow .lbl{font-weight:700}
.inwrap{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.9rem}
.inwrap .set-input{width:120px;text-align:right}
.loghint{margin:4px 0 0;font-size:.82rem;color:var(--muted)}
.loghint .chip{padding:4px 10px;font-size:.78rem;margin-left:4px}
.logsub{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.logsub .logrow{margin-top:0}
.imp{display:grid;gap:10px}
.imp-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.imp-head b{font-size:1rem}
.imp table.wk td small{display:block}
.imp .chg{font-weight:700}
.imp .same{color:var(--muted)}
details.imphelp{border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:0 12px}
details.imphelp summary{cursor:pointer;font-weight:700;color:var(--accent);padding:10px 0;font-size:.9rem}
details.imphelp ol{margin:0 0 12px;padding-left:20px;display:grid;gap:8px;font-size:.88rem;line-height:1.4}
details.imphelp code{font-size:.84rem;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:1px 5px;word-break:break-all}
.good{color:var(--accent);font-weight:700}
.bad{color:var(--treat);font-weight:700}

/* Progreso */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.tile{background:var(--bg);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px;border-left:4px solid var(--line)}
.tile .tl{font-size:.76rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.tile b{font-family:var(--font-display);font-size:1.3rem;font-variant-numeric:tabular-nums}
.tile small{font-size:.76rem;color:var(--muted);line-height:1.3}
.tile.ok{border-left-color:var(--accent)}
.tile.slow,.tile.fast{border-left-color:var(--treat)}

function loadCache(){ try { var raw = localStorage.getItem(LS_KEY); if (raw) { var c = JSON.parse(raw); for (var k in c) docs[k] = c[k]; } } catch(e){} }
function saveCache(){ try { localStorage.setItem(LS_KEY, JSON.stringify(docs)); } catch(e){ setStatus('quota'); } }
function newId(){ return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function num(v){ if (v === '' || v == null) return null; var n = parseFloat(String(v).replace(',', '.')); return isFinite(n) && n >= 0 ? Math.round(n) : null; }
function int(v){ var n = Math.round(parseFloat(v)); return isFinite(n) && n >= 0 ? n : 0; }
function macroLine(x){ return 'P ' + fmt(x.p) + ' · C ' + fmt(x.c) + ' · G ' + fmt(x.g) + ' g'; }

function dayId(s){ return 'd-' + s; }
function weekId(s){ return 'w-' + mondayOf(s); }
function getDay(s){ var d = clone(docs[dayId(s)]); d.s = d.s || {}; d.l = d.l || {}; d.x = d.x || {}; d.c = d.c || {}; d.r = d.r || {}; d.b = d.b || {}; return d; }
function getWeek(s){ var w = clone(docs[weekId(s)]); w.t = w.t || {}; return w; }
function getPrefs(){ var p = clone(docs.prefs); p.foods = p.foods || []; p.opts = p.opts || {}; p.sal = p.sal || {}; return p; }
function savePrefs(p){ docs.prefs = p; persist('prefs'); }
function getHist(){ var h = clone(docs.hist); h.e = h.e || {}; return h; }

function target(){ return getPrefs().target || TARGET; }
function protTarget(){ return getPrefs().prot || PROT; }
function carbTarget(){ return getPrefs().carb || CARB; }
function fatTarget(){ return getPrefs().fat || FAT; }
function dayTarget(s){ return MAINT_DAYS[s] ? target() + (MAINT - TARGET) : target(); }
function salN(s){ var p = getPrefs(); return p.sal[s.id] != null ? p.sal[s.id] : s.n; }
function salTotal(){ return SALIDAS.reduce(function(a, s){ return a + salN(s); }, 0); }
function bevK(b){ var p = getPrefs(); return p.bev && p.bev[b.id] != null ? p.bev[b.id] : b.kcal; }

function findMeal(id){ for (var i = 0; i < MEALS.length; i++) if (MEALS[i].id === id) return MEALS[i]; }
function findSlot(m, id){ for (var i = 0; i < m.slots.length; i++) if (m.slots[i].id === id) return m.slots[i]; }
function customOpts(key){ return (getPrefs().opts[key] || []).map(function(x){ return {id:x.id, text:x.text, kcal:x.kcal, p:x.p || 0, c:x.c || 0, g:x.g || 0, custom:true}; }); }
function allOpts(m, s){ return s.opts.concat(customOpts(m.id + '.' + s.id)); }
/* kcal y macros de una opción: las que traen kcal propias traen también sus macros */
function mac(slot, op){
  if (op.kcal != null) return {k:op.kcal, p:op.p || 0, c:op.c || 0, g:op.g || 0};
  return {k:slot.kcal, p:slot.p, c:slot.c, g:slot.g};
}
function chosen(m, s, d){
  var key = m.id + '.' + s.id, v = d.s[key];
  if (!v) return null;
  if (d.c[key] && d.c[key].id === v) return d.c[key];
  for (var i = 0; i < s.opts.length; i++) if (s.opts[i].id === v) return s.opts[i];
  var cu = customOpts(key);
  for (var j = 0; j < cu.length; j++) if (cu[j].id === v) return cu[j];
  return s.opts[0];
}

function extrasOf(d, mid){ return d.x[mid] || []; }
function mealState(m, d){
  var st = {done:0, total:m.slots.length, kcal:0, p:0, c:0, g:0, def:0, replaced:!!d.r[m.id]};
  var xs = extrasOf(d, m.id);
  xs.forEach(function(x){ st.kcal += x.kcal || 0; st.p += x.p || 0; st.c += x.c || 0; st.g += x.g || 0; });
  m.slots.forEach(function(s){ st.def += s.kcal; });
  if (st.replaced) {
    st.done = xs.length ? st.total : 0;
  } else {
    m.slots.forEach(function(s){
      var op = chosen(m, s, d);
      if (op) { var v = mac(s, op); st.done++; st.kcal += v.k; st.p += v.p; st.c += v.c; st.g += v.g; }
    });
  }
  st.complete = st.done === st.total;
  st.extras = xs.length;
  return st;
}
function dayState(s){
  var d = getDay(s), out = {kcal:0, p:0, c:0, g:0, meals:0, slots:0, pending:[], bevN:0, bevK:0, caf:0};
  MEALS.forEach(function(m){
    var st = mealState(m, d);
    out.kcal += st.kcal; out.p += st.p; out.c += st.c; out.g += st.g; out.slots += st.done;
    if (st.complete) out.meals++; else out.pending.push(m);
  });
  BEBIDAS.forEach(function(b){
    var n = d.b[b.id] || 0, k = bevK(b);
    out.bevN += n; out.bevK += n * k; out.caf += n * b.caf;
    out.kcal += n * k; out.p += n * b.p; out.c += n * b.c; out.g += n * b.g;
  });
  return out;
}
function tokensOn(s){
  var w = getWeek(s), out = [];
  for (var k in w.t) if (w.t[k] === s) out.push(k.split('-')[0]);
  return out;
}

/* Comida que "toca": según la hora si es hoy; si no, la primera sin completar. */
function suggestedMeal(s){
  var d = getDay(s), start = 0;
  if (s === today()) {
    var now = new Date(), h = now.getHours() + now.getMinutes() / 60;
    for (var i = 0; i < MEAL_HOURS.length; i++) { if (h < MEAL_HOURS[i]) { start = i; break; } }
  }
  for (var j = start; j < MEALS.length; j++) if (!mealState(MEALS[j], d).complete) return MEALS[j].id;
  for (var k = 0; k < start; k++) if (!mealState(MEALS[k], d).complete) return MEALS[k].id;
  return '';
}
function currentOpen(){ return openMeal.hasOwnProperty(selected) ? openMeal[selected] : suggestedMeal(selected); }
function nextIncomplete(afterId, d){
  var idx = 0;
  for (var i = 0; i < MEALS.length; i++) if (MEALS[i].id === afterId) idx = i;
  for (var j = idx + 1; j < MEALS.length; j++) if (!mealState(MEALS[j], d).complete) return MEALS[j];
  for (var k = 0; k < idx; k++) if (!mealState(MEALS[k], d).complete) return MEALS[k];
  return null;
}

/* ---------- Guardado ---------- */
var STATUS = {
  connecting:['Conectando…',''],
  saving:['Guardando…',''],
  saved:['Guardado en tu cuenta','ok'],
  local:['Guardado en este teléfono','ok'],
  slow:['Sin conexión todavía: los cambios podrían no guardarse','warn'],
  error:['No se pudo guardar. Revisa tu conexión y vuelve a marcar.','warn'],
  quota:['No se pudo guardar: se llenó el espacio de la app. Exporta un respaldo.','warn']
};
function setStatus(k){
  var s = STATUS[k] || STATUS.error;
  document.getElementById('statusText').textContent = s[0];
  document.getElementById('status').className = 'status ' + s[1];
}
function anyPending(){ for (var k in pending) return true; return false; }
function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }

function persist(id){
  saveCache();
  if (mode === 'db') {
    if (!pending[id]) pending[id] = {inflight:false, dirty:false};
    clearTimeout(timers[id]);
    timers[id] = setTimeout(function(){ flush(id); }, 300);
    setStatus('saving');
  } else if (mode === 'connecting') {
    unsynced[id] = 1;
  }
}
function writeOnce(id, body){
  return col.doc(id).set(body).catch(function(e){
    if (e && e.code === 'unavailable') {
      return sleep(400 + Math.random()*800).then(function(){ return col.doc(id).set(body); });
    }
    throw e;
  });
}
function flush(id){
  var p = pending[id];
  if (!p) return;
  if (p.inflight) { p.dirty = true; return; }
  p.inflight = true;
  (function loop(){
    p.dirty = false;
    writeOnce(id, clone(docs[id])).then(function(){
      if (p.dirty) return loop();
      delete pending[id];
      if (!anyPending()) setStatus('saved');
    }).catch(function(e){
      delete pending[id];
      var c = e && e.code;
      if (c === 'quota_exceeded') setStatus('quota');
      else if (c === 'invalid_argument' || c === 'revoked' || c === 'not_granted' || c === 'capability_disabled' || c === 'capability_removed') { mode = 'local'; setStatus('local'); }
      else setStatus('error');
    });
  })();
}
function subscribe(){
  var gotFull = false;
  var timer = setTimeout(function(){ if (!gotFull) setStatus('slow'); }, 10000);
  col.onSnapshot(function(snap){
    var ids = {};
    snap.docs.forEach(function(d){
      ids[d.id] = 1;
      if (!pending[d.id]) docs[d.id] = clone(d.data());
    });
    snap.docChanges().forEach(function(c){
      if (c.type === 'removed' && !pending[c.doc.id]) delete docs[c.doc.id];
    });
    if (!snap.metadata.fromCache) {
      if (!gotFull) {
        gotFull = true; clearTimeout(timer);
        Object.keys(docs).forEach(function(k){ if (!ids[k] && !pending[k]) delete docs[k]; });
      }
      if (!anyPending()) setStatus('saved');
    }
    saveCache(); render();
  }, function(err){
    clearTimeout(timer);
    mode = 'local';
    setStatus(err && err.code === 'revoked' ? 'local' : 'error');
  });
}
function connect(){
  mode = 'local'; setStatus('local'); unsynced = {};
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}
  refreshAi();
  render(true);
}

/* ---------- Claude por API (clave guardada solo en este teléfono) ---------- */
var AI_LS = 'registro-comidas-claude';
var AI_MODELS = [
  ['claude-opus-5-5', 'Opus 5.5'],
  ['claude-sonnet-5-5', 'Sonnet 5.5'],
  ['claude-haiku-5-5', 'Haiku 5.5']
];
function aiCfg(){ try { return JSON.parse(localStorage.getItem(AI_LS)) || {}; } catch(e){ return {}; } }
function setCfg(k, v){
  var c = aiCfg();
  v = String(v == null ? '' : v).trim();
  if (v) c[k] = v; else delete c[k];
  try { localStorage.setItem(AI_LS, JSON.stringify(c)); } catch(e){}
  refreshAi(); render(true);
  if (k === 'key') toast(v ? 'Guardé tu clave en este teléfono.' : 'Borré la clave.');
}
function aiModel(){ var m = aiCfg().model; return AI_MODELS.some(function(x){ return x[0] === m; }) ? m : AI_MODELS[0][0]; }
function refreshAi(){
  sampleOff = false;
  if (aiCfg().key) { sampleFn = {json:callClaude}; imgLimits = {maxInputBytes:60000000}; }
  else { sampleFn = null; imgLimits = null; }
}
function aiErr(code, msg){ var e = new Error(msg || code); e.code = code; return e; }
function fileToJpeg(file){
  return new Promise(function(res, rej){
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function(){
      var max = 1568, w = img.naturalWidth, h = img.naturalHeight, k = Math.min(1, max / Math.max(w, h));
      var cv = document.createElement('canvas');
      cv.width = Math.max(1, Math.round(w * k)); cv.height = Math.max(1, Math.round(h * k));
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url);
      res(cv.toDataURL('image/jpeg', 0.85).split(',')[1]);
    };
    img.onerror = function(){ URL.revokeObjectURL(url); rej(aiErr('image_rejected')); };
    img.src = url;
  });
}
function parseJsonText(t){
  t = String(t || '').replace(/```(?:json)?/gi, '');
  var a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a < 0 || b <= a) throw aiErr('invalid_json');
  try { return JSON.parse(t.slice(a, b + 1)); } catch(e){ throw aiErr('invalid_json'); }
}
function callClaude(prompt, opts){
  opts = opts || {};
  var cfg = aiCfg(), model = aiModel();
  if (!cfg.key) return Promise.reject(aiErr('no_key'));
  return Promise.all((opts.images || []).map(fileToJpeg)).then(function(imgs){
    var content = imgs.map(function(b64){ return {type:'image', source:{type:'base64', media_type:'image/jpeg', data:b64}}; });
    content.push({type:'text', text:prompt});
    var body = {model:model, max_tokens:8000, output_config:{effort:'low'}, messages:[{role:'user', content:content}]};
    var headers = {'content-type':'application/json', 'x-api-key':cfg.key, 'anthropic-version':'2026-10-21', 'anthropic-dangerous-direct-browser-access':'true'};
    /* Si el filtro de seguridad rechaza la consulta, la API la reintenta en otro modelo */
    if (model !== 'claude-haiku-5-5') { headers['anthropic-beta'] = 'server-side-fallback-2026-07-01'; body.fallbacks = 'default'; }
    return fetch('https://api.anthropic.com/v1/messages', {method:'POST', headers:headers, body:JSON.stringify(body), signal:opts.signal});
  }).then(function(r){
    return r.json().catch(function(){ return {}; }).then(function(j){
      if (r.ok) return j;
      var msg = (j && j.error && j.error.message) || ('HTTP ' + r.status);
      if (r.status === 401 || r.status === 403) throw aiErr('bad_key', msg);
      if (r.status === 429) throw aiErr('rate_limited', msg);
      if (r.status === 413) throw aiErr('prompt_too_large', msg);
      if (/credit balance|billing/i.test(msg)) throw aiErr('no_credit', msg);
      if (r.status === 400 && /image/i.test(msg)) throw aiErr('image_rejected', msg);
      if (r.status >= 500) throw aiErr('overloaded', msg);
      throw aiErr('api_error', msg);
    });
  }).then(function(j){
    if (j.stop_reason === 'refusal') throw aiErr('refused');
    var text = (j.content || []).filter(function(b){ return b.type === 'text'; }).map(function(b){ return b.text; }).join('\n');
    if (!text && j.stop_reason === 'max_tokens') throw aiErr('invalid_json');
    return parseJsonText(text);
  }).catch(function(e){
    if (e && e.name === 'AbortError') throw aiErr('cancelled');
    if (e && e.code) throw e;
    throw aiErr('network', e && e.message);
  });
}

/* ---------- Respaldo ---------- */
var DOC_RE = /^(d-\d{4}-\d{2}-\d{2}|w-\d{4}-\d{2}-\d{2}|prefs|hist)$/;
function exportBackup(){
  var name = 'registro-comidas-' + today() + '.json';
  var blob = new Blob([JSON.stringify({app:'registro-comidas', v:1, exportado:new Date().toISOString(), docs:docs}, null, 1)], {type:'application/json'});
  try { localStorage.setItem('registro-comidas-respaldo', today()); } catch(e){}
  var file = null;
  try { file = new File([blob], name, {type:'application/json'}); } catch(e){}
  if (file && navigator.canShare && navigator.canShare({files:[file]})) {
    navigator.share({files:[file], title:'Respaldo del registro de comidas'}).then(function(){ render(true); }).catch(function(){});
    return;
  }
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
  render(true);
}
function importBackup(file){
  if (!file) return;
  var fr = new FileReader();
  fr.onload = function(){
    var data;
    try { data = JSON.parse(fr.result); } catch(e){ toast('Ese archivo no es un respaldo válido.'); return; }
    var src = data && data.docs && typeof data.docs === 'object' ? data.docs : data, ids = [];
    for (var k in src) if (DOC_RE.test(k) && src[k] && typeof src[k] === 'object' && !Array.isArray(src[k])) ids.push(k);
    if (!ids.length) { toast('No encontré registros en ese archivo.'); return; }
    var nd = ids.filter(function(k){ return k.indexOf('d-') === 0; }).length;
    if (!confirm('Importar ' + nd + (nd === 1 ? ' día' : ' días') + ' y tus ajustes. Lo que ya está en este teléfono para esos mismos días se reemplaza. ¿Seguir?')) return;
    var undo = ids.map(snapshotUndo);
    ids.forEach(function(k){ docs[k] = clone(src[k]); });
    saveCache(); render(true);
    toast('Importé ' + nd + (nd === 1 ? ' día' : ' días') + '.', undo);
  };
  fr.readAsText(file);
}

/* ---------- Aviso con deshacer ---------- */
var toastTimer = null, undoData = null;
function toast(msg, undo){
  undoData = undo || null;
  document.getElementById('toastText').textContent = msg;
  document.getElementById('toastUndo').hidden = !undo;
  var t = document.getElementById('toast');
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('show'); undoData = null; }, 5000);
}
document.getElementById('toastUndo').addEventListener('click', function(){
  if (!undoData) return;
  (Array.isArray(undoData) ? undoData : [undoData]).forEach(function(u){
    if (u.prev === undefined) delete docs[u.id]; else docs[u.id] = u.prev;
    persist(u.id);
  });
  undoData = null;
  document.getElementById('toast').classList.remove('show');
  render(true);
});
function snapshotUndo(id){ return {id:id, prev: docs[id] === undefined ? undefined : clone(docs[id])}; }

/* ---------- Acciones de la pauta ---------- */
function saveDay(d, mid, undo, quiet){
  var before = mid ? mealState(findMeal(mid), getDay(selected)).complete : false;
  docs[dayId(selected)] = d;
  persist(dayId(selected));
  if (mid) {
    var m = findMeal(mid), after = mealState(m, d).complete;
    if (!before && after) {
      var nx = nextIncomplete(mid, d);
      openMeal[selected] = nx ? nx.id : '';
      swapOpen = null; form = null;
      if (!quiet) toast(m.name + ' listo.' + (nx ? ' Sigue: ' + nx.name.toLowerCase() + '.' : ' ¡Día completo!'), undo);
    }
  }
  render(true);
}
function setChoice(d, m, s, op){
  var key = m.id + '.' + s.id;
  d.s[key] = op.id;
  if (op.custom) d.c[key] = {id:op.id, text:op.text, kcal:op.kcal, p:op.p || 0, c:op.c || 0, g:op.g || 0}; else delete d.c[key];
}
function clearChoice(d, key){ delete d.s[key]; delete d.c[key]; }

function toggleSlot(mid, sid){
  var m = findMeal(mid), s = findSlot(m, sid), d = getDay(selected), k = mid + '.' + sid;
  var undo = snapshotUndo(dayId(selected));
  if (d.s[k]) clearChoice(d, k); else setChoice(d, m, s, s.opts[0]);
  saveDay(d, mid, undo);
}
function pickOpt(mid, sid, oid){
  var m = findMeal(mid), s = findSlot(m, sid), d = getDay(selected), k = mid + '.' + sid;
  var undo = snapshotUndo(dayId(selected));
  if (d.s[k] === oid && m.snack) clearChoice(d, k);
  else { var all = allOpts(m, s); for (var i = 0; i < all.length; i++) if (all[i].id === oid) setChoice(d, m, s, all[i]); }
  swapOpen = null;
  saveDay(d, mid, undo);
}
function mealAll(mid, clear){
  var m = findMeal(mid), d = getDay(selected);
  var undo = snapshotUndo(dayId(selected));
  m.slots.forEach(function(s){
    var k = mid + '.' + s.id;
    if (clear) clearChoice(d, k);
    else if (!d.s[k]) setChoice(d, m, s, s.opts[0]);
  });
  if (clear) { delete d.x[mid]; delete d.r[mid]; openMeal[selected] = mid; saveDay(d, null); toast(m.name + ' desmarcado.', undo); }
  else saveDay(d, mid, undo);
}
function setReplaced(mid, on){
  var d = getDay(selected), m = findMeal(mid);
  var undo = snapshotUndo(dayId(selected));
  if (on) {
    d.r[mid] = 1;
    m.slots.forEach(function(s){ clearChoice(d, mid + '.' + s.id); });
    docs[dayId(selected)] = d; persist(dayId(selected)); render(true);
    toast('Escribe o anota lo que comiste en vez del ' + m.name.toLowerCase() + '.', undo);
  } else {
    delete d.r[mid];
    form = null;
    docs[dayId(selected)] = d; persist(dayId(selected)); render(true);
  }
}
function toggleMeal(mid){
  openMeal[selected] = currentOpen() === mid ? '' : mid;
  swapOpen = null; form = null;
  if (ai && !ai.busy) { clearPhoto(); ai = null; }
  render(true);
}
function toggleSwap(key){ swapOpen = swapOpen === key ? null : key; form = null; render(true); }
function toggleLibre(id){
  var d = getDay(selected);
  if (d.l[id]) delete d.l[id]; else d.l[id] = 1;
  docs[dayId(selected)] = d; persist(dayId(selected)); render(true);
}
function tapToken(tid){
  var w = getWeek(selected), sid = tid.split('-')[0], sal = null;
  SALIDAS.forEach(function(s){ if (s.id === sid) sal = s; });
  var undo = snapshotUndo(weekId(selected));
  var name = sid === 'trago' ? 'un trago' : sid === 'comida' ? 'la comida libre' : 'el gustito';
  if (w.t[tid]) { delete w.t[tid]; toast('Liberaste ' + name + '.', undo); }
  else {
    for (var i = 0; i < salN(sal); i++) { var t = sid + '-' + i; if (!w.t[t]) { w.t[t] = selected; break; } }
    toast('Anotaste ' + name + ' el ' + shortDay(selected) + '.', undo);
  }
  docs[weekId(selected)] = w; persist(weekId(selected)); render(true);
}
function stepBev(id, delta){
  var d = getDay(selected);
  var n = Math.max(0, Math.min(20, (d.b[id] || 0) + delta));
  if (n) d.b[id] = n; else delete d.b[id];
  docs[dayId(selected)] = d; persist(dayId(selected)); render(true);
}
function goDay(s){
  selected = s; swapOpen = null; form = null;
  if (ai && ai.ctl) ai.ctl.abort();
  clearPhoto(); ai = null;
  if (cls && cls.ctl) cls.ctl.abort();
  dropPhoto(cls); cls = null;
  render(true);
}

/* ---------- Escribir lo que comí (Claude) y memoria ---------- */
function normKey(t){ return String(t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9ñ½¼¾ ]+/g, ' ').replace(/\s+/g, ' ').trim(); }
function words(t){ return normKey(t).split(' ').filter(function(w){ return w.length >= 4; }); }
function sumItems(items){
  var t = {kcal:0, p:0, c:0, g:0};
  items.forEach(function(x){ t.kcal += x.kcal; t.p += x.p; t.c += x.c; t.g += x.g; });
  return t;
}
function cleanItem(x){
  if (!x || typeof x !== 'object') return null;
  var name = String(x.nombre || x.name || '').trim().slice(0, 80);
  if (!name) return null;

/* ---------- Peso, pasos y entrenamiento ---------- */
var START_W = null, GOAL_W = null, PLAN_END = '2027-02-17', STEP_GOAL = 7000, TRAIN_GOAL = 3;
/* Gasto: TMB ~1.785 kcal (Mifflin). Con ~4.500 pasos/día y fuerza 3×/sem el factor real es ~1,375–1,4 → GET ~2.475.

function stepsAvg(s){

  for (var i = 0; i < 7; i++) { var v = rawDay(addDays(s, -i)).st; if (v != null) { sum += v; n++; } }

  s += '<line class="ch-goal" x1="' + x(i0) + '" y1="' + y(START_W) + '" x2="' + x(n - 1) + '" y2="' + y(gEnd) + '"/>';
  s += '<text class="ch-t" x="' + (x(n - 1) + 5) + '" y="' + (y(gEnd) + 3.5) + '">Meta</text>';
  s += '<circle class="ch-start" cx="' + x(i0) + '" cy="' + y(START_W) + '" r="3.5"/>';
  var ti = -1;
  days.forEach(function(d, i){ if (d.s === today()) ti = i; });
  if (ti >= 0) s += '<line class="ch-today" x1="' + x(ti) + '" x2="' + x(ti) + '" y1="' + T1 + '" y2="' + (T3 + H3) + '"/>';
  days.forEach(function(d, i){ if (d.w) s += '<circle class="ch-pt' + (d.wn ? ' nf' : '') + (d.pre ? ' pre' : '') + '" cx="' + x(i).toFixed(1) + '" cy="' + y(d.w).toFixed(1) + '" r="2.8"><title>' + ddmm(d.s) + ': ' + fmtKg(d.w) + ' kg' + (d.bf ? ' · ' + fmtPct(d.bf) + ' % grasa' : '') + (d.wn ? ' (no en ayunas)' : '') + (d.pre ? ' (antes de la pauta)' : '') + '</title></circle>'; });
  var path = '', pen = false, lastI = -1;
  av.forEach(function(a, i){
    if (a == null) { pen = false; return; }
    path += (pen ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(a).toFixed(1) + ' ';
    pen = true; lastI = i;
  });
  if (path) {
    s += '<path class="ch-avg" d="' + path + '"/>';
    s += '<circle class="ch-end" cx="' + x(lastI) + '" cy="' + y(av[lastI]) + '" r="4"/>';
    s += '<text class="ch-v" x="' + (x(lastI) + 7) + '" y="' + (y(av[lastI]) - 7) + '">' + fmtKg(av[lastI]) + '</text>';
  }
  /* panel 2: kcal */
  var kmax = 3000;
  days.forEach(function(d){ if (d.kcal && d.kcal > kmax) kmax = d.kcal; });
  function yk(k){ return T2 + H2 - k / kmax * H2; }

  s += '<text class="ch-h" x="' + L + '" y="' + (T2 - 9) + '">Kcal registradas</text>';
  s += '<line class="ch-base" x1="' + L + '" x2="' + (W - R) + '" y1="' + (T2 + H2) + '" y2="' + (T2 + H2) + '"/>';
  days.forEach(function(d, i){

  });
  s += '<line class="ch-goal" x1="' + L + '" x2="' + (W - R) + '" y1="' + yk(tk) + '" y2="' + yk(tk) + '"/>';
  s += '<text class="ch-t" x="' + (W - R + 5) + '" y="' + (yk(tk) + 3.5) + '">' + fmt(tk) + '</text>';
  /* panel 3: pasos y fuerza */
  var smax = 12000;
  days.forEach(function(d){ if (d.st && d.st > smax) smax = d.st; });
  function ys(v){ return T3 + H3 - v / smax * H3; }
  s += '<text class="ch-h" x="' + L + '" y="' + (T3 - 9) + '">Pasos <tspan class="ch-tl">· ▲ bajo la línea = día de fuerza</tspan></text>';
  s += '<line class="ch-base" x1="' + L + '" x2="' + (W - R) + '" y1="' + (T3 + H3) + '" y2="' + (T3 + H3) + '"/>';
  days.forEach(function(d, i){
    if (d.st) s += '<rect class="ch-steps' + (d.st >= STEP_GOAL ? ' ok' : '') + '" x="' + (x(i) - bw / 2).toFixed(1) + '" y="' + ys(d.st).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + (T3 + H3 - ys(d.st)).toFixed(1) + '" rx="1.5"><title>' + ddmm(d.s) + ': ' + fmt(d.st) + ' pasos</title></rect>';

  });
  /* promedio semanal anotado: segmento sobre la semana */
  var seen = {};
  days.forEach(function(d){
    var mon = mondayOf(d.s); if (seen[mon]) return; seen[mon] = 1;
    var wd = docs[weekId(mon)]; if (!wd || wd.st == null) return;
    var a = -1, b = -1;
    days.forEach(function(e, j){ if (mondayOf(e.s) === mon && !e.future) { if (a < 0) a = j; b = j; } });
    if (a < 0) return;
    var yy = ys(Math.min(wd.st, smax)).toFixed(1);
    s += '<line class="ch-wst" x1="' + (x(a) - bw / 2).toFixed(1) + '" x2="' + (x(b) + bw / 2).toFixed(1) + '" y1="' + yy + '" y2="' + yy + '"><title>Semana del ' + ddmm(mon) + ': ' + fmt(wd.st) + ' pasos/día (promedio anotado)</title></line>';
  });
  s += '<line class="ch-goal" x1="' + L + '" x2="' + (W - R) + '" y1="' + ys(STEP_GOAL) + '" y2="' + ys(STEP_GOAL) + '"/>';
  s += '<text class="ch-t" x="' + (W - R + 5) + '" y="' + (ys(STEP_GOAL) + 3.5) + '">' + fmt(STEP_GOAL) + '</text>';
  return s + '</svg>';
}

  SALIDAS.forEach(function(x){ if (x.id === id) sal = x; });
  if (!sal) return 0;
  for (var i = 0; i < salN(sal); i++) if (w.t[id + '-' + i]) used++;

  for (var d = mon; d < s; d = addDays(d, 1)) {
    if (d < PLAN_START) continue;
    var ds = dayState(d);
    if (ds.meals >= 4) { B += ds.kcal - dayTarget(d); n++; }

/* Exceso que deja en la semana, según la regla de cada salida */
function clsExcess(r, total, asSalida){
  var t = r.tipo;
  if (t === 'libre') return 0;
  if (t === 'pauta') return Math.max(0, total - r.reemplaza);
  if (t === 'gustito') return asSalida ? Math.max(0, total - 150) : total;
  if (t === 'trago') return asSalida ? Math.max(0, total - 150) : total;
  if (t === 'comida_libre') return Math.max(0, total - r.reemplaza);
  return total;
}

function extrasHtml(m, d){

function addZoneHtml(m, d){

  var h = '<div class="addzone"><button type="button" class="addbtn" data-act="add" data-meal="' + m.id + '">+ Anotar a mano</button>';
  if (!d.r[m.id]) h += '<button type="button" class="linkbtn" data-act="replace" data-meal="' + m.id + '">Comí algo distinto a la pauta</button>';

}

function slotLine(s, op){

/* ---------- Eventos ---------- */
document.addEventListener('click', function(ev){
  var b = ev.target.closest('[data-act]');
  if (!b) return;
  var a = b.getAttribute('data-act'), ds = b.dataset;
  if (a === 'slot') toggleSlot(ds.meal, ds.slot);
  else if (a === 'opt') pickOpt(ds.meal, ds.slot, ds.opt);
  else if (a === 'swap') toggleSwap(ds.key);
  else if (a === 'all') mealAll(ds.meal, false);
  else if (a === 'clear') mealAll(ds.meal, true);
  else if (a === 'meal') toggleMeal(ds.meal);
  else if (a === 'libre') toggleLibre(ds.id);
  else if (a === 'token') tapToken(ds.id);
  else if (a === 'help') { showHelp = !showHelp; renderSalidas(); }
  else if (a === 'day') goDay(ds.date);
  else if (a === 'today') goDay(today());
  else if (a === 'add') openForm('extra', ds.meal, ds.meal);
  else if (a === 'newopt') openForm('opt', ds.meal, ds.key);
  else if (a === 'cancel') { form = null; render(true); }
  else if (a === 'submit') submitForm();
  else if (a === 'preset') { if (form) { form.kcal = ds.k; form.err = ''; render(true); } }
  else if (a === 'quick') quickAdd(ds.meal, ds.id);
  else if (a === 'xdel') removeExtra(ds.meal, ds.id);
  else if (a === 'odel') removeCustomOpt(ds.key, ds.id);
  else if (a === 'fdel') removeFood(ds.id);
  else if (a === 'hdel') removeHist(ds.key);
  else if (a === 'replace') setReplaced(ds.meal, true);
  else if (a === 'unreplace') setReplaced(ds.meal, false);
  else if (a === 'settings') { showSettings = !showSettings; renderSettings(); }
  else if (a === 'step') stepSal(ds.id, +ds.d);
  else if (a === 'bev') stepBev(ds.id, +ds.d);
  else if (a === 'reset') resetSettings();
  else if (a === 'airun') runAi(ds.meal, false);
  else if (a === 'airecalc') { if (ai) { ai.result = null; runAi(ai.meal, true); } }
  else if (a === 'aistop') { if (ai && ai.ctl) ai.ctl.abort(); }
  else if (a === 'aicancel') { if (ai) { ai.result = null; ai.err = ''; } render(true); }
  else if (a === 'aiadd') addAi();
  else if (a === 'aidel') { if (ai && ai.result) { ai.result.items.splice(+ds.i, 1); ai.result.fromHist = false; render(true); } }
  else if (a === 'hadd') addFromHist(ds.meal, ds.key);
  else if (a === 'tr') toggleTrain(ds.v);
  else if (a === 'wn') toggleFasting();
  else if (a === 'impopen') { imp = {text:''}; renderDaylog(); var ta = document.querySelector('[data-imp]'); if (ta) ta.focus(); }
  else if (a === 'impclose') { imp = null; renderDaylog(); }
  else if (a === 'impgo') impApply();
  else if (a === 'view') setView(ds.v);
  else if (a === 'range') { chartAll = ds.v === '1'; renderProgress(); }
  else if (a === 'settarget') applyTarget(+ds.v);
  else if (a === 'photoclear') { clearPhoto(); render(true); }
  else if (a === 'clsrun') runCls();
  else if (a === 'clsstop') { if (cls && cls.ctl) cls.ctl.abort(); }
  else if (a === 'clscancel') { dropPhoto(cls); cls = null; render(true); }
  else if (a === 'clsphotoclear') { dropPhoto(cls); render(true); }
  else if (a === 'clsmeal') { if (cls) { cls.meal = ds.meal; render(true); } }
  else if (a === 'clsadd') addCls();
  else if (a === 'export') exportBackup();
  else if (a === 'delkey') setCfg('key', '');
});
document.addEventListener('input', function(ev){
  var el = ev.target;
  if (el.dataset && el.dataset.imp && imp) { imp.text = el.value; var pv = document.getElementById('imp-prev'); if (pv) pv.innerHTML = impPreviewHtml(); return; }
  if (el.dataset && el.dataset.cls) { var cs = clsState(); cs.text = el.value; cs.err = ''; if (cs.result) cs.result = null; return; }
  if (el.dataset && el.dataset.ai) {
    var a = ensureAi(el.dataset.ai);
    a.text = el.value;
    if (a.result) a.result = null;
    a.err = '';
    var box = document.getElementById('sug-' + el.dataset.ai);
    if (box) box.innerHTML = sugHtml(el.dataset.ai, el.value);
    return;
  }
  if (!form || !el.dataset || !el.dataset.f) return;
  form[el.dataset.f] = el.type === 'checkbox' ? el.checked : el.value;
  if (form.err) form.err = '';
});
document.addEventListener('change', function(ev){
  var el = ev.target;
  if (el.dataset && el.dataset.actCheck === 'replace' && ai) { ai.replace = el.checked; return; }
  if (el.dataset && el.dataset.actCheck === 'clsreplace' && cls) { cls.replace = el.checked; return; }
  if (el.dataset && el.dataset.actCheck === 'clssalida' && cls) { cls.asSalida = el.checked; render(true); return; }
  if (el.dataset && el.dataset.f === 'save' && form) { form.save = el.checked; return; }
  if (el.dataset && el.dataset.set) setSetting(el.dataset.set, el.value);
  if (el.dataset && el.dataset.cfg) { setCfg(el.dataset.cfg, el.value); return; }
  if (el.dataset && el.dataset.backup) { importBackup(el.files && el.files[0]); el.value = ''; return; }
  if (el.dataset && el.dataset.log) setLog(el.dataset.log, el.value);
  if (el.dataset && el.dataset.photo) pickPhoto(el.dataset.photo, el.files && el.files[0]);
});
document.addEventListener('keydown', function(ev){
  var t = ev.target;
  if (ev.key === 'Enter' && form && t.dataset && t.dataset.f && t.type !== 'checkbox') { ev.preventDefault(); submitForm(); }
  if (ev.key === 'Enter' && t.dataset && (t.dataset.set || t.dataset.log || t.dataset.cfg)) { t.blur(); }
  if (ev.key === 'Enter' && !ev.shiftKey && t.dataset && t.dataset.ai) { ev.preventDefault(); t.blur(); runAi(t.dataset.ai, false); }
});
document.addEventListener('focusout', function(){
  setTimeout(function(){ if (needRender && !isEditing()) render(); }, 0);
});
document.getElementById('prevWeek').addEventListener('click', function(){ goDay(addDays(selected, -7)); });
document.getElementById('nextWeek').addEventListener('click', function(){ goDay(addDays(selected, 7)); });

loadCache();
connect();
if ('serviceWorker' in navigator) window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
})();
</script>
</body>
</html>
